name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: Build release artifacts
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/cifuse${ext}" ./cmd/cifuse
              (cd dist && tar -czf "cifuse_${VERSION}_${goos}_${goarch}.tar.gz" "cifuse${ext}")
            done
          done
          (cd dist && sha256sum cifuse_*.tar.gz > checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" dist/checksums.txt dist/cifuse_*.tar.gz --generate-notes